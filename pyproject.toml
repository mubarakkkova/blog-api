[tool.ruff]
line-length = 88
exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"settings/env/*.py" = ["F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "settings"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "rest_framework",
    "django",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
rest_framework = ["rest_framework", "rest_framework_simplejwt"]
django = ["django"]